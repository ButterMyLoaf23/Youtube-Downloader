<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Downloader</title>
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>
    <main>
      <div class="window-bar"><span>YouTube Downloader</span><span class="window-buttons" aria-hidden="true">_ [] X</span></div>
      <div class="page-content">
        <div class="brand-mark" aria-hidden="true">YD</div>
        <p class="eyebrow">:: MEDIA DOWNLOAD CENTER ::</p>
        <h1>YouTube Downloader</h1>
        <p class="intro">Save videos and audio for offline access in just a few seconds.</p>
      <form id="download-form" action="/download" method="post">
        <input id="url" name="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required maxlength="2048" autocomplete="off">
        <select id="format" name="format" aria-label="Download format">
          <option value="mp4">MP4 video</option>
          <option value="mp3">MP3 audio</option>
        </select>
        <button id="download-button" type="submit">Download MP4</button>
      </form>
      <section id="progress-panel" class="progress-panel" hidden aria-live="polite">
        <div class="progress-heading">
          <span id="status">Preparing your download...</span>
          <span class="pulse-dot" aria-hidden="true"></span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Download in progress">
          <div class="progress-bar"></div>
        </div>
        <small id="progress-help">The download will begin automatically when it is ready.</small>
      </section>
      </div>
    </main>
    <script src="/js/app.js" defer></script>
  </body>
</html>
